<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phần đăng nhập</title>
</head>
<body>

    <div>
        <!-- Phần tiêu đề trang theo các thiết kế phổ biến -->
        <div>
            <h1>Đăng Nhập</h1>
            <p>Vui lòng đăng nhập vào tài khoản của bạn</p>
        </div>

        <!-- Form đăng nhập chính -->
        <form action="#" method="POST">
            <div>
                <label for="email">Email hoặc Số điện thoại</label>
                <input type="text" id="email" name="email" placeholder="Nhập email của bạn..." required>
            </div>

            <div>
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required>
            </div>

            <!-- Các tùy chọn phụ (thường hay có trong Figma: Ghi nhớ / Quên mật khẩu) -->
            <div>
                <div>
                    <input type="checkbox" id="remember-me" name="remember">
                    <label for="remember-me">Ghi nhớ đăng nhập</label>
                </div>
                <div>
                    <a href="#">Quên mật khẩu?</a>
                </div>
            </div>

            <!-- Nút submit form -->
            <div>
                <button type="submit">Đăng Nhập</button>
            </div>
        </form>

        <!-- Khu vực chọn nhanh quyền (Role) phục vụ cho demo bài tập lớn -->
        <div>
            <p>Chọn nhanh quyền (Dành riêng cho Demo):</p>
            <div>
                <button type="button">Quản trị viên (Admin)</button>
                <button type="button">Người bán (Vendor)</button>
                <button type="button">Khách hàng (Customer)</button>
            </div>
        </div>
    </div>

</body>
</html>
