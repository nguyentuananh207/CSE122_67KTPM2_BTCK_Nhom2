<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="baitap1.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bốn mùa</title>
</head>
<body>
    <div>
        <div class="title">
            <h1>BỐN MÙA</h1>
        </div>
        <div class="paragraph1">
            <p>
                Xuân về hoa nở khắp trời<br>
                Hạ nắng cháy rực phố quen<br>
                Thu về lá rụng bên thềm<br>
            </p>
            <hr>
        </div>
        <div class="paragraph2">
            <p style="color:red">
                Đông sang gió lạnh<br>
                Bốn mùa là bốn giấc mơ<br>
                Thời gian đi mãi ta chờ đợi ai<br>
            </p>
            <hr>
        <div class="paragraph3">
            <p>
                Một năm rồi lại một năm<br>
                Vẫn còn câu hát thì thầm quê hương<br>
                Chờ xuân nắng mới soi đường<br>
            </p>
    </div>
</body>
</html>
